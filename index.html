<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>palavra do ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --brown: #8a5a3c;      /* troque aqui a cor do texto */
    --brown-soft: #a97c5f; /* cor dos textos menores */
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --bg: #F5EDE9;       /* cor do callout Brown no Notion (day mode). Pra voltar ao transparente: transparent */
    color-scheme: light;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg) !important;
  }

  body {
    display: flex;
    align-items: center;      /* centraliza na vertical */
    justify-content: center;  /* centraliza na horizontal */
    font-family: var(--serif);
    color: var(--brown);
    text-align: center;
  }

  .box { padding: 8px 16px; }

  .greeting {
    margin: 0;
    font-size: clamp(18px, 3.2vw, 24px);
    font-style: italic;
    color: var(--brown-soft);
  }

  .clock {
    margin: 2px 0 0;
    font-size: clamp(48px, 11vw, 92px);
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: 0.03em;
    font-variant-numeric: lining-nums tabular-nums;
  }

  .date {
    margin: 0 0 18px;
    font-size: clamp(14px, 2.4vw, 19px);
    letter-spacing: 0.14em;
    color: var(--brown-soft);
  }

  .rule {
    width: 44px;
    height: 1px;
    margin: 0 auto 16px;
    background: var(--brown-soft);
    opacity: 0.6;
  }

  .label {
    margin: 0;
    font-size: clamp(13px, 2.2vw, 17px);
    letter-spacing: 0.18em;
    color: var(--brown-soft);
  }

  .word {
    margin: 2px 0 0;
    font-size: clamp(34px, 8vw, 64px);
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <main class="box">
    <p class="greeting">bom dia, amadinha</p>
    <p class="clock" id="clock">--:--</p>
    <p class="date" id="date"></p>
    <div class="rule"></div>
    <p class="label">minha palavra do ano</p>
    <h1 class="word">disciplina</h1>
  </main>

  <script>
    function tick() {
      var now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      document.getElementById("date").textContent =
        now.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
